<title>Mitigation Bench Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a revision desk. A sticky mode bar on top (Study, Flashcards, Mock viva, Cheat sheet);
   in Study mode a syllabus rail tracks each module's state and the main column holds one module. */
:root {
  --bg: #EDF1F6; --grid: rgba(19, 32, 58, 0.045);
  --surface: #FFFFFF; --surface-2: #F4F6FA; --line: #D4DBE6; --line-2: #B7C1D2;
  --ink: #13203A; --muted: #4C5A75; --faint: #75819A;
  --amber: #9C5A00; --amber-fill: #E8A93A; --amber-ink: #1C1305; --amber-wash: rgba(232, 169, 58, 0.15); --amber-line: rgba(176, 110, 10, 0.45);
  --cyan: #0A6F82; --cyan-wash: rgba(10, 111, 130, 0.08);
  --good: #1B7A4C; --good-wash: rgba(27, 122, 76, 0.10); --bad: #B63A25; --bad-wash: rgba(182, 58, 37, 0.09);
  --m-none: #6E7480; --m-rem: #2F6FDB; --m-rem_tensored: #7351E6; --m-zne: #CC5A1E; --m-zne_rem: #1E8A57;
  --plate: #FFFFFF; --scrim: rgba(8, 12, 22, 0.84);
  --shadow: 0 1px 2px rgba(19, 32, 58, 0.06), 0 8px 24px rgba(19, 32, 58, 0.06);
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1426; --grid: rgba(152, 165, 191, 0.05);
    --surface: #111D33; --surface-2: #172540; --line: #21304D; --line-2: #34466C;
    --ink: #E9EEF7; --muted: #A3AFC7; --faint: #6F7C97;
    --amber: #E8A93A; --amber-fill: #E8A93A; --amber-ink: #1C1305; --amber-wash: rgba(232, 169, 58, 0.10); --amber-line: rgba(232, 169, 58, 0.40);
    --cyan: #43D3EA; --cyan-wash: rgba(67, 211, 234, 0.08);
    --good: #35C486; --good-wash: rgba(53, 196, 134, 0.12); --bad: #F06A55; --bad-wash: rgba(240, 106, 85, 0.12);
    --m-none: #8A909B; --m-rem: #4B93FF; --m-rem_tensored: #9A7DFF; --m-zne: #EB7638; --m-zne_rem: #2DB577;
    --plate: #F3F5F9; --scrim: rgba(3, 6, 12, 0.86);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1426; --grid: rgba(152, 165, 191, 0.05);
  --surface: #111D33; --surface-2: #172540; --line: #21304D; --line-2: #34466C;
  --ink: #E9EEF7; --muted: #A3AFC7; --faint: #6F7C97;
  --amber: #E8A93A; --amber-fill: #E8A93A; --amber-ink: #1C1305; --amber-wash: rgba(232, 169, 58, 0.10); --amber-line: rgba(232, 169, 58, 0.40);
  --cyan: #43D3EA; --cyan-wash: rgba(67, 211, 234, 0.08);
  --good: #35C486; --good-wash: rgba(53, 196, 134, 0.12); --bad: #F06A55; --bad-wash: rgba(240, 106, 85, 0.12);
  --m-none: #8A909B; --m-rem: #4B93FF; --m-rem_tensored: #9A7DFF; --m-zne: #EB7638; --m-zne_rem: #2DB577;
  --plate: #F3F5F9; --scrim: rgba(3, 6, 12, 0.86);
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--ink); background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
a { color: var(--cyan); }
code { font: 500 0.86em/1 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; color: var(--ink); white-space: nowrap; }
b.num { font-family: var(--mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* mode bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: grid; gap: 1px; min-width: 0; }
.brand b { font: 700 19px/1.1 var(--display); letter-spacing: 0.01em; }
.brand span { font: 500 10.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
.sitenav { font: 500 12px/1.2 var(--mono); color: var(--cyan); text-decoration: none; border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 9px; }
.sitenav:hover { border-color: var(--cyan); }
.modes { display: flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.modes button { border: 0; background: transparent; padding: 7px 12px; border-radius: 4px; cursor: pointer; font: 600 14px/1 var(--display); letter-spacing: 0.02em; color: var(--muted); }
.modes button:hover { color: var(--ink); }
.modes button[aria-selected="true"] { background: var(--amber-fill); color: var(--amber-ink); }
.overall { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 400 12px/1.2 var(--mono); color: var(--faint); }
.meter { width: 120px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--amber-fill); }

.shell { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; }

/* study mode */
.study { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 44px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow-y: auto; display: grid; gap: 16px; padding-bottom: 12px; }
.part { display: grid; gap: 1px; }
.part h4 { font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); padding: 0 8px 5px; }
.rail a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 4px; color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.3; }
.rail a:hover { background: var(--surface); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
.rail .no { font: 500 12px/1 var(--mono); color: var(--faint); }
.rail .st { font: 500 11px/1 var(--mono); color: var(--faint); white-space: nowrap; }
.rail .st.done { color: var(--good); }
.mod-pick { display: none; gap: 6px; }
.mod-pick select { background: var(--surface); border: 1px solid var(--line-2); border-radius: 5px; padding: 8px 10px; font-size: 15px; width: 100%; }

.mod { display: grid; gap: 30px; max-width: 790px; min-width: 0; }
.mod-head { display: grid; gap: 12px; }
.eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.eyebrow b { color: var(--amber); font-weight: 500; }
.mod h2 { font: 700 clamp(1.9rem, 4vw, 2.6rem)/1.06 var(--display); letter-spacing: -0.005em; text-wrap: balance; }
.lede { font-size: 18px; line-height: 1.55; color: var(--muted); max-width: 64ch; }
.blk { display: grid; gap: 12px; min-width: 0; }
.blk > h3 { font: 600 12px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); }
.ideas { list-style: none; padding: 0; display: grid; gap: 12px; }
.ideas li { padding-left: 20px; position: relative; color: var(--muted); max-width: 70ch; }
.ideas li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 7px; height: 7px; background: var(--amber-fill); transform: rotate(45deg); }
.ideas b { color: var(--ink); font-weight: 600; }
.ideas i { font-style: italic; }
.eqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.eq { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.eq .k { font: 500 10.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.eq .x { font: 500 15px/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.eq .w { font-size: 13.5px; line-height: 1.45; color: var(--muted); }

.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.bench-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; align-items: baseline; }
.bench-h h4 { font: 600 17px/1.2 var(--display); letter-spacing: 0.01em; }
.bench-h span { font: 500 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.ctl { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: end; }
.field { display: grid; gap: 6px; min-width: 0; }
.flabel { font: 500 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.flabel output { color: var(--amber); letter-spacing: 0; text-transform: none; margin-left: 6px; font-size: 12.5px; font-weight: 600; }
input[type="range"] { width: 230px; max-width: 100%; accent-color: var(--amber-fill); }
input[type="number"], input[type="text"], input[type="search"] { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 7px 9px; font: 500 14px/1.2 var(--mono); width: 100%; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; border-right: 1px solid var(--line-2); padding: 6px 11px; cursor: pointer; font: 500 13px/1.1 var(--mono); color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--amber-fill); color: var(--amber-ink); }
.out { font: 400 14px/1.65 var(--mono); color: var(--muted); }
.out b { color: var(--ink); font-weight: 600; }
.note { font-size: 13.5px; color: var(--faint); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.line { position: relative; height: 46px; margin: 4px 6px 0; }
.line .axis { position: absolute; left: 0; right: 0; top: 18px; height: 2px; background: var(--line-2); }
.line .band { position: absolute; top: 10px; height: 18px; background: var(--amber-wash); border: 1px solid var(--amber-line); border-radius: 3px; }
.line .dot { position: absolute; top: 12px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--amber-fill); box-shadow: 0 0 0 2px var(--surface); }
.line .tick { position: absolute; top: 30px; font: 400 11px/1 var(--mono); color: var(--faint); transform: translateX(-50%); }

.stack { display: flex; height: 30px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
.stack div { height: 100%; display: flex; align-items: center; padding-left: 8px; font: 600 12px/1 var(--mono); color: var(--amber-ink); white-space: nowrap; overflow: hidden; }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 400 12.5px/1.4 var(--mono); color: var(--muted); }
.keyrow i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.bars { display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.bar .lab { font: 500 13px/1.2 var(--mono); color: var(--ink); text-align: right; }
.bar .trk { position: relative; height: 20px; background: var(--surface-2); border-radius: 3px; }
.bar .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bar .cap { grid-column: 2; font: 400 12.5px/1.35 var(--mono); color: var(--muted); }
.bar .cap b { color: var(--ink); }

figure.fig { display: grid; gap: 8px; min-width: 0; }
figure.fig button { padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--plate); cursor: zoom-in; display: block; width: 100%; overflow: hidden; }
figure.fig img { display: block; width: 100%; height: auto; }
figure.fig figcaption { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.nums div { background: var(--surface); padding: 11px 13px; display: grid; gap: 4px; align-content: start; }
.nums b { font: 600 21px/1.1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.nums span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }

.say { border: 1px solid var(--amber-line); background: var(--amber-wash); padding: 14px 16px; border-radius: 6px; display: grid; gap: 6px; }
.say span { font: 500 11px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.say p { font: italic 400 16.5px/1.55 var(--body); color: var(--ink); }

.quiz { display: grid; gap: 12px; }
.quiz-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score { font: 600 13px/1 var(--mono); color: var(--amber); }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.qt { font: 500 15.5px/1.45 var(--body); color: var(--ink); }
.opts { display: grid; gap: 6px; }
.opts button { text-align: left; padding: 8px 12px; border-radius: 5px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1.4; }
.opts button:hover:not([disabled]) { border-color: var(--ink); color: var(--ink); }
.opts button[disabled] { cursor: default; }
.opts button.right { border-color: var(--good); background: var(--good-wash); color: var(--ink); }
.opts button.wrong { border-color: var(--bad); background: var(--bad-wash); color: var(--ink); }
.why { font-size: 14.5px; line-height: 1.5; color: var(--muted); }
.why b { color: var(--ink); }

.modfoot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
.btn { padding: 9px 14px; border-radius: 5px; cursor: pointer; font: 600 14px/1.1 var(--display); letter-spacing: 0.02em; background: var(--amber-fill); color: var(--amber-ink); border: 1px solid var(--amber-fill); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--amber-fill); filter: none; }
.btn[aria-pressed="true"] { background: var(--good-wash); color: var(--good); border-color: var(--good); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 500 10.5px/1.25 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 9px 12px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); line-height: 1.45; }
td b { color: var(--ink); font-weight: 600; }
td.num, th.num { text-align: right; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
tr:last-child td { border-bottom: 0; }
.kv td:first-child { width: 46%; }
.kv td.num { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.verdict { font: 600 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; white-space: nowrap; display: inline-block; }
.verdict.sup { color: var(--good); background: var(--good-wash); }
.verdict.par { color: var(--amber); background: var(--amber-wash); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }

.papers { display: grid; gap: 10px; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 5px; }
.paper .ph { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.paper .pn { font: 600 12px/1 var(--mono); color: var(--amber); }
.paper .pt { font-weight: 600; color: var(--ink); font-size: 15px; line-height: 1.35; }
.paper .pv { font: 400 12.5px/1.4 var(--mono); color: var(--faint); }
.paper p { font-size: 14.5px; line-height: 1.5; color: var(--muted); }
.paper p b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font: 500 12.5px/1.1 var(--mono); color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--amber-fill); border-color: var(--amber-fill); color: var(--amber-ink); }

/* flashcards */
.center { max-width: 780px; margin: 0 auto; display: grid; gap: 18px; }
.page-h { display: grid; gap: 8px; }
.page-h h2 { font: 700 clamp(1.8rem, 4vw, 2.4rem)/1.08 var(--display); text-wrap: balance; }
.page-h p { color: var(--muted); max-width: 64ch; }
.flash { min-height: 290px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 26px 28px; display: grid; gap: 16px; align-content: center; cursor: pointer; box-shadow: var(--shadow); text-align: left; width: 100%; color: var(--ink); }
.flash .tag { font: 500 11px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.flash .front { font: 600 clamp(1.3rem, 3vw, 1.7rem)/1.28 var(--display); color: var(--ink); }
.flash .back { font-size: 16.5px; line-height: 1.62; color: var(--muted); border-top: 1px dashed var(--line-2); padding-top: 14px; }
.flash .back b { color: var(--ink); }
.flash .hint { font: 400 12px/1.2 var(--mono); color: var(--faint); }
.boxes { display: flex; gap: 8px; flex-wrap: wrap; }
.boxes span { font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.boxes b { color: var(--ink); }

/* viva */
.vpanel { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 22px 24px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.vtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.vno { font: 500 12px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.timer { font: 600 24px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.timer.low { color: var(--bad); }
.vq { font: 600 clamp(1.3rem, 3vw, 1.7rem)/1.28 var(--display); text-wrap: balance; }
.ans { color: var(--muted); font-size: 16px; line-height: 1.65; display: grid; gap: 10px; border-top: 1px dashed var(--line-2); padding-top: 14px; }
.ans b { color: var(--ink); }
.vlist { list-style: none; padding: 0; display: grid; gap: 2px; counter-reset: v; }
.vlist button { width: 100%; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 4px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 14.5px; line-height: 1.4; }
.vlist button:hover { background: var(--surface); color: var(--ink); }
.vlist .i { font: 500 12px/1 var(--mono); color: var(--faint); }
.rate { font: 600 10.5px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
.rate.good { color: var(--good); background: var(--good-wash); }
.rate.part { color: var(--amber); background: var(--amber-wash); }
.rate.miss { color: var(--bad); background: var(--bad-wash); }
.rate.none { color: var(--faint); }

/* cheat sheet */
.sheet { display: grid; gap: 34px; }
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; align-items: start; }
.sheet section { display: grid; gap: 12px; min-width: 0; }
.sheet h3 { font: 700 20px/1.2 var(--display); }
.gloss { display: grid; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.gloss div { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 14px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.gloss div:last-child { border-bottom: 0; }
.gloss dt { font: 600 13.5px/1.4 var(--mono); color: var(--ink); }
.gloss dd { font-size: 14.5px; line-height: 1.5; color: var(--muted); }

.lb { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
.lb img { max-width: min(1250px, 100%); max-height: 88vh; background: var(--plate); border-radius: 6px; }
.lb p { color: #E9EEF7; font-size: 14px; max-width: 900px; text-align: center; margin-top: 10px; }

@media (max-width: 920px) {
  .study { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .rail { display: none; }
  .mod-pick { display: grid; }
  .overall { margin-left: 0; }
  .sheet-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .bar { grid-template-columns: 86px minmax(0, 1fr); }
  .modes button { padding: 7px 9px; font-size: 13px; }
  .gloss div { grid-template-columns: minmax(0, 1fr); }
  .flash, .vpanel { padding: 20px 18px; }
  .meter { width: 80px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg button, .chip, .opts button, .modes button, .rail a { transition: background-color 120ms, border-color 120ms, color 120ms; }
}

  var VIVA = [
    ["What is the difference between error mitigation and error correction?", "Error correction encodes one logical qubit redundantly across many physical qubits and fixes errors on every shot, which needs extra qubits and fault-tolerant hardware. Mitigation needs no extra qubits: it runs a handful of extra circuits (calibration circuits, or the same circuit at amplified noise) and corrects the <b>average</b> classically afterwards. It never touches an individual shot."],
    ["Why must global-folding scale factors be odd? What is U(U†U)ᵏ?", "Folding replaces U with U·(U†U)ᵏ for λ = 2k + 1. U† is the exact inverse of U, so U†U is the identity on paper and the ideal output is unchanged, but every extra gate adds real noise. Each U†U pair adds 2 to λ, so only odd λ (1, 3, 5) are reachable by appending whole pairs."],
    ["Why doesn't ZNE remove readout error in your setup?", "Folding repeats the gates; the measurement happens exactly once, after folding, at every λ. The readout error is identical at every λ, so the extrapolation, which relies on seeing the signal change with λ, cannot see it. Dividing the exact readout attenuation (1 − 2p_ro)ⁿ out of the infinite-shot ZNE result removes most of the remaining bias, which confirms the leftover is readout. That is why zne_rem exists."],
    ["Derive the Richardson coefficients for λ = (1, 3, 5). Where does the ≈2.3× variance factor come from?", "γᵢ = Πⱼ≠ᵢ λⱼ/(λⱼ − λᵢ): γ₁ = (3·5)/((3−1)(5−1)) = 15/8; γ₂ = (1·5)/((1−3)(5−3)) = −5/4; γ₃ = (1·3)/((1−5)(3−5)) = 3/8. They sum to 1. With independent ±1 averages, Var(E₀) = Σγᵢ²(1 − Eᵢ²)/N, so the std scales by √Σγᵢ² = √5.22 ≈ 2.28. We measured " + n("var.ratio.emp.high") + "×–" + n("var.ratio.emp.moderate") + "×, slightly above theory, which we attribute to folded circuits' shots not being perfectly independent."],
    ["Why did you use optimization_level = 0?", "Any higher level would recognize U† followed by U as the identity and delete the pair, which removes exactly the gates added to scale the noise. At level 0 nothing is cancelled, so the folded circuit really runs λ times the gates."],
    ["Why can REM produce negative probabilities, and what did you do about it?", "A and p̃ are both finite-shot estimates, so A⁻¹p̃ can push entries below zero: a quasi-probability vector. We record the negative mass (worst " + n("negmass.max") + " full, " + n("negmass.max.tensored") + " tensored). The expectation value comes from the raw vector, which is linear and unbiased; we project onto the simplex only when a real distribution is needed, for Hellinger fidelity and TVD."],
    ["Why does full REM need 2ⁿ circuits? What does tensored REM assume, and when does it fail?", "Full calibration measures the readout response to every one of the 2ⁿ basis states, one circuit each. Tensored REM assumes each qubit's readout error is independent, builds a 2×2 matrix per qubit from two circuits (all 0, all 1) and combines them by Kronecker product. It fails, or needs augmenting, when readout errors are correlated between qubits; our noise model has none, which is exactly why tensored REM matches full REM here (mean |diff| " + n("rem_tensored.mean_abs_diff") + ")."],
    ["What does the depolarizing parameter mean in Qiskit? How did you map the course's \"% error\"?", "depolarizing_error(λ, k) implements ε(ρ) = (1 − λ)ρ + λ·Tr(ρ)·I/2ᵏ: with probability λ the k qubits become maximally mixed. \"X% single-qubit error\" became depolarizing_error(X/100, 1) on every ry and rz, \"Y% two-qubit error\" depolarizing_error(Y/100, 2) on every cx, and \"Z% readout\" a symmetric bit flip with probability Z/100 on every qubit, logged in DECISIONS.md."],
    ["Why parity as the observable? Why |E| ≥ 0.3, and what bias does it introduce?", "Parity is global: a flip on any qubit from any source flips its sign, so it is maximally sensitive to every noise channel and makes mitigation visible. A random parity is often near zero, where shot noise (σ ≈ 0.031) swamps the signal and relative error is undefined, so instances must reach |E_exact| ≥ 0.3. The cost: the instances are not a uniform sample of random circuits, a selection bias we list."],
    ["Explain your encoding. Why scale features to [0, π]? What limits expressivity?", "Each feature xₖ is encoded as ry(xₖ) on qubit k, so ⟨Zₖ⟩ = cos xₖ before the ansatz. [0, π] is half a Bloch meridian: the minimum maps to |0⟩, the maximum to |1⟩, no wrap-around. By Schuld, Sweke and Meyer, one encoding layer restricts the model to frequencies {−1, 0, +1} per feature; data re-uploading would lift that and is future work."],
    ["Why were the scalers and PCA fit only on training data? What is data leakage?", "Leakage is when test-set information influences fitting, even indirectly, for example a scaler whose mean and variance come from the full dataset. It inflates accuracy. We fit StandardScaler, PCA and MinMaxScaler on the 80 training samples only and only transform (then clip) the 20 test samples. A test shows refitting on train + test gives different parameters."],
    ["Why might accuracy barely change under noise while expectation error grows?", "Accuracy depends only on sign(E_hat). Depolarizing noise shrinks |E| toward zero roughly uniformly but rarely flips the sign of a confidently classified point, and 20 test samples move accuracy in 5% steps. Unmitigated margin retention fell from " + n("qml.margin.none.ideal") + " to " + n("qml.margin.none.high") + " while accuracy only went from " + n("qml.acc.none.ideal") + " to " + n("qml.acc.none.high") + " (figures B4, B5)."],
    ["Is there any quantum advantage in your results?", "No, and none is claimed. The exact VQC's accuracy (" + n("qml.vqc_exact.acc.mean") + ") is comparable to LR and SVM on the identical split and features, sometimes slightly higher, sometimes lower. At 2–4 qubits and 100 samples, nothing can be said about advantage either way."],
    ["How did you make the comparison with LR and SVM fair?", "All three models see exactly the same stratified 80:20 split (same indices from the same seed) and the same preprocessed features, after identical train-only scaling. No model saw test labels during fitting, and LR and SVM hyperparameters are fixed in the config, never tuned on the test set."],
    ["Are 5 seeds enough? How did you compute confidence intervals, and what can the tests detect?", "Five is small and we say so. Per condition we report mean, std (ddof = 1), median and a 95% CI of mean ± 2.776·std/√5. Per condition we use a paired t-test, because Wilcoxon on 5 pairs cannot go below p = 0.0625. Pooling 30 pairs per noise level gives a Wilcoxon test with real power, used for the headline claims."],
    ["What happens at high noise, and why might ZNE struggle there?", "At the optional high level every method's error is larger, but every mitigated method still beats none, and zne_rem stays strongest (median " + n("imp.median.zne_rem.high") + "%). ZNE shows strain: more exponential fits fail as the folded signal crosses zero or gets too small to log, though Richardson estimates never left [−1, 1]. This is a small echo of the theoretical limits (refs. 11, 12)."],
    ["What is your research gap and proposed improvement? What did the data show?", "Readout mitigation and extrapolation are mostly studied separately, often at hardware scale, and rarely connected to downstream QML metrics against classical baselines. We test two cheaper variants: tensored REM (2 calibration circuits instead of 2ⁿ), within " + n("rem_tensored.mean_abs_diff") + " of full REM on average; and variance-optimal ZNE shot allocation, std ratio " + n("alloc.ratio.empirical") + " against " + n("alloc.ratio.theory") + " predicted, at the same total budget."],
    ["How would results differ on real hardware?", "Our noise is incoherent and Markovian; hardware adds coherent errors, crosstalk, T1/T2 relaxation, drift and leakage. Folding may not scale coherent noise cleanly, REM's stable-readout assumption can be broken by drift, and the deepest folded circuits (5× base depth) could exceed coherence times. Both methods would likely help less and need recalibration more often."],
    ["Why not use PEC (probabilistic error cancellation)?", "PEC can be unbiased, but its sampling overhead grows exponentially with noise strength and circuit size, and it needs accurate noise tomography first. That is impractical across 120 conditions and 4 noise levels, so it is future work for a smaller, targeted study."],
    ["What do Hellinger fidelity and TVD measure, and how do they differ?", "Both compare two distributions over the same 2ⁿ outcomes. Hellinger fidelity (Σ√(pq))² is 1 for identical and 0 for disjoint distributions, and is more sensitive to differences on high-probability outcomes. TVD ½Σ|p − q| is 0 for identical and 1 for disjoint, and weighs every outcome's absolute difference equally. REM improved both (fidelity up in " + n("fid.better.moderate") + " cells at moderate noise, TVD down in " + n("tvd.better.moderate") + ")."],
    ["Summarize your main findings in under a minute.", "At moderate noise every method helped and zne_rem was best, with a median error cut of " + n("imp.median.zne_rem.moderate") + "%. At low noise, REM alone was the dependable choice and ZNE alone was not significant. Costs scale as expected: 1 + 2ⁿ circuits for REM, 3 for tensored REM, 3 circuits with 9× CNOTs for ZNE. On the classifier, mitigation restored margins strongly but barely moved accuracy, and the VQC was comparable to LR and SVM. Both cheaper variants worked."],
    ["Walk me through what happens to one circuit, from the config file to the report.", "The config fixes n, L, the noise level and the seed. Angles are drawn from a derived seed until |E_exact| ≥ 0.3; the statevector gives E_exact. Aer runs the base circuit, the folded circuits and the calibration circuits with 1024 shots each. All five methods post-process those same counts. The row goes into runs.csv; analyze.py aggregates and tests; the plotting and report scripts read only those outputs."],
    ["Why did Track A include a 6-qubit case?", "The group sheet asks for it, beyond the course's 2 and 4. It is also where full REM's 2ⁿ growth becomes visible: " + n("circuits.rem.n6") + " circuits and " + n("shots.rem.n6") + " shots per estimate, against " + n("circuits.rem_tensored.n6") + " circuits for tensored REM."],
    ["What is success probability and what did it show?", "P_succ is the estimated probability of the most likely ideal bitstring, reported as P_succ_hat / P_succ_exact. Noise pulls the ratio below 1; REM raises it, and zne_rem brings it close to 1 at moderate noise, consistent with REM correcting the whole distribution and ZNE removing gate bias."]
  ];

    richardson: function (host) {
      var sets = { "1,3": [1, 3], "1,3,5": [1, 3, 5], "1,3,5,7": [1, 3, 5, 7] };
      var st = { set: "1,3,5", m: "zne" };
      var ex = EX.methods;
      host.innerHTML = benchHead("Richardson weights", "γᵢ = Πⱼ≠ᵢ λⱼ/(λⱼ − λᵢ)") +
        '<div class="ctl"><div class="field"><span class="flabel">Scale factors λ</span><div class="seg" id="ri-set"></div></div></div>' +
        '<div class="tw"><table id="ri-tab"></table></div><p class="out" id="ri-sum"></p>' +
        benchHead("Extrapolate a real circuit", "n = " + EX.n + " · L = " + EX.L + " · " + EX.noise + " · seed " + EX.seed) +
        '<div class="ctl"><div class="field"><span class="flabel">Counts used</span><div class="seg" id="ri-m"></div></div></div>' +
        '<div class="grid2"><label class="field" for="ri-e1"><span class="flabel">E(λ = 1)</span><input type="number" id="ri-e1" step="0.001"></label>' +
        '<label class="field" for="ri-e3"><span class="flabel">E(λ = 3)</span><input type="number" id="ri-e3" step="0.001"></label>' +
        '<label class="field" for="ri-e5"><span class="flabel">E(λ = 5)</span><input type="number" id="ri-e5" step="0.001"></label></div>' +
        '<div id="ri-plot"></div><p class="out" id="ri-out"></p>';
      function gam(ls) { return ls.map(function (li, i) { var g = 1; ls.forEach(function (lj, j) { if (j !== i) g *= lj / (lj - li); }); return g; }); }
      function frac(x) {
        for (var d = 1; d <= 64; d++) { var nn = Math.round(x * d); if (Math.abs(nn / d - x) < 1e-9) return d === 1 ? String(nn) : nn + "/" + d; }
        return fmt(x, 4);
      }
      function updSet() {
        var ls = sets[st.set], g = gam(ls), s2 = g.reduce(function (a, x) { return a + x * x; }, 0), sum = g.reduce(function (a, x) { return a + x; }, 0);
        document.getElementById("ri-tab").innerHTML = '<thead><tr><th>λ</th>' + ls.map(function (l) { return '<th class="num">' + l + "</th>"; }).join("") + "</tr></thead><tbody><tr><td><b>γ</b></td>" +
          g.map(function (x) { return '<td class="num">' + frac(x) + "</td>"; }).join("") + "</tr><tr><td><b>decimal</b></td>" + g.map(function (x) { return '<td class="num">' + fmt(x, 4) + "</td>"; }).join("") + "</tr></tbody>";
        document.getElementById("ri-sum").innerHTML = "Σγ = <b>" + fmt(sum, 3) + "</b> · std amplification √Σγ² = <b>" + fmt(Math.sqrt(s2), 3) + "</b>×" +
          (st.set === "1,3,5" ? " (the project's choice)." : st.set === "1,3" ? ": cheaper and less noisy, but a straight line cannot follow curvature." : ": more points let the polynomial bend more, at a much higher variance cost.");
      }
      function setInputs() {
        var e = ex[st.m];
        document.getElementById("ri-e1").value = e.E1; document.getElementById("ri-e3").value = e.E3; document.getElementById("ri-e5").value = e.E5;
        updFit();
      }
      function updFit() {
        var ls = [1, 3, 5], E = ["ri-e1", "ri-e3", "ri-e5"].map(function (id) { return +document.getElementById(id).value; });
        var g = gam(ls), E0 = g.reduce(function (a, x, i) { return a + x * E[i]; }, 0);
        var mx = 3, my = (E[0] + E[1] + E[2]) / 3, sxy = 0, sxx = 0;
        ls.forEach(function (l, i) { sxy += (l - mx) * (E[i] - my); sxx += (l - mx) * (l - mx); });
        var lin0 = my - (sxy / sxx) * mx, exact = ex.none.E_exact, raw = ex.none.E_hat;
        var poly = function (x) { return ls.reduce(function (a, li, i) { var t = E[i]; ls.forEach(function (lj, j) { if (j !== i) t *= (x - lj) / (li - lj); }); return a + t; }, 0); };
        drawFit(document.getElementById("ri-plot"), ls, E, poly, E0, exact, mcol(st.m));
        var signChange = E.some(function (v) { return v <= 0; }) && E.some(function (v) { return v > 0; });
        document.getElementById("ri-out").innerHTML = "Richardson E₀ = <b>" + fmt(E0, 4) + "</b> · linear fit at 0 = <b>" + fmt(lin0, 4) + "</b> · exact = <b>" + fmt(exact, 4) + "</b> · unmitigated = <b>" + fmt(raw, 4) + "</b>.<br>" +
          "Error: none " + fmt(Math.abs(raw - exact), 4) + " → Richardson <b>" + fmt(Math.abs(E0 - exact), 4) + "</b>." +
          (signChange ? " E(λ) changes sign, so the exponential fit fails (NaN) here, exactly as recorded in runs.csv." : "") +
          (st.m === "zne" ? " Switch to zne_rem to see REM-corrected points: the readout part of the gap closes." : "");
      }
      segmented(document.getElementById("ri-set"), Object.keys(sets), ["1, 3", "1, 3, 5", "1, 3, 5, 7"], st.set, function (v) { st.set = v; updSet(); });
      segmented(document.getElementById("ri-m"), ["zne", "zne_rem"], null, st.m, function (v) { st.m = v; setInputs(); });
      ["ri-e1", "ri-e3", "ri-e5"].forEach(function (id) { document.getElementById(id).addEventListener("input", updFit); });
      updSet(); setInputs();
    },

    seed: function (host) {
      host.innerHTML = benchHead("Derive a seed the way the code does", "SHA-256 → first 8 hex → mod 2³¹ − 1") +
        '<div class="ctl"><label class="field" for="sd-in" style="flex:1 1 260px"><span class="flabel">Parts joined with |</span><input type="text" id="sd-in" value="transpile|4|4|moderate|0" spellcheck="false" autocomplete="off"></label></div>' +

      var inp = document.getElementById("sd-in"), out = document.getElementById("sd-out");
      function upd() {
        if (!(window.crypto && crypto.subtle && window.TextEncoder)) { out.textContent = "This browser does not expose SHA-256 to the page, so the seed cannot be computed here."; return; }
        var s = inp.value;
        crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
          if (inp.value !== s) return;
          var hex = Array.prototype.map.call(new Uint8Array(buf), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
          var seed = parseInt(hex.slice(0, 8), 16) % 2147483647;
          out.innerHTML = "sha256 = " + hex.slice(0, 8) + "<span style=\"color:var(--faint)\">" + hex.slice(8, 24) + "…</span><br>seed = int(\"" + hex.slice(0, 8) + "\", 16) mod 2147483647 = <b>" + seed + "</b>";
        }).catch(function () { out.textContent = "SHA-256 is unavailable here."; });
      }
      inp.addEventListener("input", upd);
      upd();
    },

  /* flashcards */
  var ALLCARDS = [];

  var order = {}; ALLCARDS.forEach(function (c) { order[c.id] = Math.random(); });
  var cardState = { cur: null, flipped: false };
  function deck() {
    var f = S.cardFilter && MOD_BY_ID[S.cardFilter] ? S.cardFilter : "all";
    return ALLCARDS.filter(function (c) { return f === "all" || c.mod.id === f; });
  }
  function nextCard(exclude) {
    var d = deck().slice().sort(function (a, c) { var ba = S.cards[a.id] || 0, bc = S.cards[c.id] || 0; return ba - bc || order[a.id] - order[c.id]; });
    var pick = d.filter(function (c) { return c.id !== exclude; })[0] || d[0];
    cardState.cur = pick ? pick.id : null; cardState.flipped = false;
  }
  function renderCards() {
    if (!cardState.cur || !deck().some(function (c) { return c.id === cardState.cur; })) nextCard();
    var d = deck(), counts = [0, 0, 0, 0];
    d.forEach(function (c) { counts[S.cards[c.id] || 0]++; });
    var c = ALLCARDS.filter(function (x) { return x.id === cardState.cur; })[0];
    var f = S.cardFilter && MOD_BY_ID[S.cardFilter] ? S.cardFilter : "all";

      "<p>Say the answer out loud before you flip. \"Again\" sends a card back to the start of the queue; \"Got it\" moves it up a box. Cards you know least come first. Keys: space flips, 1 is Again, 2 is Got it.</p></header>" +
      '<label class="field" for="cf"><span class="flabel">Deck</span><select id="cf" style="background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;font-size:15px"><option value="all">All modules</option>' +
      MODULES.map(function (m) { return '<option value="' + m.id + '"' + (f === m.id ? " selected" : "") + ">" + m.no + ". " + m.title + "</option>"; }).join("") + "</select></label>" +
      '<div class="boxes"><span>New <b>' + counts[0] + "</b></span><span>Again <b>" + counts[1] + "</b></span><span>Learning <b>" + counts[2] + "</b></span><span>Known <b>" + counts[3] + "</b></span></div>";
    if (c) {
      h += '<button type="button" class="flash" id="flash" aria-live="polite"><span class="tag">Module ' + c.mod.no + " · " + c.mod.title + '</span><span class="front">' + c.f + "</span>" +
        (cardState.flipped ? '<span class="back">' + c.b + "</span>" : '<span class="hint">Click or press space to flip</span>') + "</button>" +
        '<div class="btn-row"><button type="button" class="btn ghost" id="c-again"' + (cardState.flipped ? "" : " disabled") + '>1 · Again</button><button type="button" class="btn" id="c-got"' + (cardState.flipped ? "" : " disabled") + '>2 · Got it</button><button type="button" class="btn ghost" id="c-skip">Skip</button><button type="button" class="btn ghost" id="c-reset">Reset boxes</button></div>';
    }
    h += "</div>";
    view.innerHTML = h;
    document.getElementById("cf").addEventListener("change", function (e) { S.cardFilter = e.target.value; save(); nextCard(); renderCards(); });
    if (!c) return;
    document.getElementById("flash").addEventListener("click", flip);
    document.getElementById("c-again").addEventListener("click", function () { rate(1); });
    document.getElementById("c-got").addEventListener("click", function () { rate(2); });
    document.getElementById("c-skip").addEventListener("click", function () { nextCard(cardState.cur); renderCards(); });
    document.getElementById("c-reset").addEventListener("click", function () { deck().forEach(function (x) { delete S.cards[x.id]; }); save(); nextCard(); renderCards(); });
  }
  function flip() { cardState.flipped = !cardState.flipped; renderCards(); var fl = document.getElementById("flash"); if (fl) fl.focus(); }
  function rate(k) {
    if (!cardState.flipped || !cardState.cur) return;
    var id = cardState.cur, box = S.cards[id] || 0;
    S.cards[id] = k === 1 ? 1 : Math.min(3, Math.max(box, 1) + 1);
    order[id] = 1 + Math.random(); save();
    nextCard(id); renderCards();
    var fl = document.getElementById("flash"); if (fl) fl.focus();
  }

  /* mock viva */
  var vivaState = { i: 0, shown: false, left: 0, timer: null, timed: false };
  function stopTimer() { if (vivaState.timer) { clearInterval(vivaState.timer); vivaState.timer = null; } }
  function startTimer() {
    stopTimer(); if (!vivaState.timed) return;
    vivaState.left = 90; paintTimer();
    vivaState.timer = setInterval(function () { vivaState.left--; paintTimer(); if (vivaState.left <= 0) stopTimer(); }, 1000);
  }
  function paintTimer() {
    var t = document.getElementById("v-timer"); if (!t) { stopTimer(); return; }
    var s = Math.max(0, vivaState.left);
    t.textContent = vivaState.timed ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : "";
    t.className = "timer" + (vivaState.timed && s <= 15 ? " low" : "");
  }
  function pickViva() {
    var pri = function (i) { var r = S.viva[i]; return r === undefined ? 0 : r === "miss" ? 1 : r === "part" ? 2 : 3; };
    var idx = VIVA.map(function (_, i) { return i; }).filter(function (i) { return i !== vivaState.i; });
    var best = Math.min.apply(null, idx.map(pri));
    var pool = idx.filter(function (i) { return pri(i) === best; });
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function renderViva() {
    var i = vivaState.i, q = VIVA[i], r = S.viva[i];
    var tally = { good: 0, part: 0, miss: 0 };
    VIVA.forEach(function (_, k) { if (S.viva[k]) tally[S.viva[k]]++; });
    var lab = { good: "Nailed it", part: "Partly", miss: "Missed" };
    var h = '<div class="center"><header class="page-h"><p class="eyebrow"><b>Mock viva</b> · ' + VIVA.length + " questions</p><h2>Answer out loud, then compare.</h2>" +
      "<p>Answer each question in your own words before revealing the model answer, then rate yourself honestly. \"Next question\" picks unrated questions first, then the ones you missed. The timer gives you 90 seconds, about the length of a real viva answer.</p></header>" +
      '<div class="boxes"><span>Nailed <b>' + tally.good + "</b></span><span>Partly <b>" + tally.part + "</b></span><span>Missed <b>" + tally.miss + "</b></span><span>Unrated <b>" + (VIVA.length - tally.good - tally.part - tally.miss) + "</b></span></div>" +
      '<section class="vpanel"><div class="vtop"><span class="vno">Question ' + (i + 1) + " of " + VIVA.length + (r ? ' · <span class="rate ' + r + '">' + lab[r] + "</span>" : "") + '</span><span id="v-timer" class="timer"></span></div>' +
      '<p class="vq">' + q[0] + "</p>" +
      (vivaState.shown ? '<div class="ans"><p>' + q[1] + "</p></div>" + '<div class="btn-row"><button type="button" class="btn ghost" data-r="miss">Missed it</button><button type="button" class="btn ghost" data-r="part">Partly</button><button type="button" class="btn" data-r="good">Nailed it</button></div>' :
        '<div class="btn-row"><button type="button" class="btn" id="v-show">Show model answer</button></div>') +
      '<div class="btn-row"><button type="button" class="btn ghost" id="v-next">Next question</button><button type="button" class="btn ghost" id="v-timed" aria-pressed="' + vivaState.timed + '">' + (vivaState.timed ? "Timer on (90 s)" : "Timer off") + '</button><button type="button" class="btn ghost" id="v-reset">Clear ratings</button></div></section>' +
      '<section class="blk"><h3 style="font:600 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)">All questions</h3><ol class="vlist">' + VIVA.map(function (v, k) {
        var rr = S.viva[k];
        return '<li><button type="button" data-k="' + k + '"' + (k === i ? ' aria-current="true" style="background:var(--surface);color:var(--ink)"' : "") + '><span class="i">' + (k + 1) + "</span><span>" + v[0] + '</span><span class="rate ' + (rr || "none") + '">' + (rr ? lab[rr] : "–") + "</span></button></li>";
      }).join("") + "</ol></section></div>";
    view.innerHTML = h;
    paintTimer();
    var show = document.getElementById("v-show");
    if (show) show.addEventListener("click", function () { vivaState.shown = true; stopTimer(); renderViva(); });
    view.querySelectorAll("[data-r]").forEach(function (bt) { bt.addEventListener("click", function () { S.viva[i] = bt.getAttribute("data-r"); save(); go(pickViva()); }); });
    document.getElementById("v-next").addEventListener("click", function () { go(pickViva()); });
    document.getElementById("v-timed").addEventListener("click", function () {
      vivaState.timed = !vivaState.timed;
      renderViva();

    view.querySelectorAll("[data-k]").forEach(function (bt) { bt.addEventListener("click", function () { go(+bt.getAttribute("data-k")); window.scrollTo(0, 0); }); });
    function go(k) { vivaState.i = k; vivaState.shown = false; renderViva(); startTimer(); }
  }

    bt.addEventListener("click", function () {
      var md = bt.getAttribute("data-mode");
      var target = md === "study" ? cur : md;
      if (location.hash.replace("#", "") === target) { mode = md; render(); } else location.hash = target;
    });
  });
  window.addEventListener("hashchange", function () { parseHash(); render(); window.scrollTo(0, 0); });

  /* lightbox */
  var lb = document.getElementById("lb");
  view.addEventListener("click", function (e) {
    var z = e.target.closest && e.target.closest(".zoom");
    if (!z) return;
    var f = FIG[z.getAttribute("data-fig")];
    document.getElementById("lb-img").src = f.src;
    document.getElementById("lb-img").alt = f.caption;
    document.getElementById("lb-cap").textContent = f.caption;
    lb.hidden = false;
  });
  lb.addEventListener("click", function () { lb.hidden = true; });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !lb.hidden) { lb.hidden = true; return; }
    if (mode !== "cards") return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === " " || e.key === "Enter") { if (tag !== "button" || e.target.id === "flash") { e.preventDefault(); flip(); } }
    else if (e.key === "1") rate(1);
    else if (e.key === "2") rate(2);
  });

  parseHash();
  render();
})();
</script>
